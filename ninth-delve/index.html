<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Ninth Delve — The Whisperlock</title>
  <style>
    :root { --void: #0A0A12; --bone: #D9CBB3; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: var(--void); overflow: hidden; }
    body { display: block; font-family: monospace; color: var(--bone); }
    /* integer-upscaled pixel buffer (Tech §3) */
    #screen { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: crosshair; }
    /* UI roots — populated per milestone (hud M2, dicetray M3, menus M4, report M7) */
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui > * { position: absolute; pointer-events: auto; }
    #hud, #dicetray, #menus, #report { display: none; }
  </style>
</head>
<body>
  <canvas id="screen" width="384" height="216"></canvas>
  <div id="ui">
    <div id="hud"></div>
    <div id="dicetray"></div>
    <div id="menus"></div>
    <div id="report"></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
